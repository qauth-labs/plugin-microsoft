# Every pull request, and the release before it stages anything (release.yml
# calls this workflow): format (Oxfmt), lint (Oxlint), type-check, the unit
# tests and the plugin SDK's preset kit (checkUpstreamOidcPreset), the build
# and the tarball's file list; then the end-to-end suite (e2e/run.sh), which
# runs QAuth's server image with this plugin installed on top, against a mock
# of the Microsoft identity platform. pnpm's version is package.json's
# packageManager.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The Node QAuth's server image runs, and the plugin with it.
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - name: Unit tests and the SDK's preset kit (checkUpstreamOidcPreset)
        run: pnpm test
      - run: pnpm run build
      - name: The files npm would receive
        run: |
          set -euo pipefail
          pnpm pack --pack-destination "$RUNNER_TEMP/pack"
          tar -tzf "$RUNNER_TEMP"/pack/*.tgz

  e2e:
    runs-on: ubuntu-24.04
    # Most of it is building QAuth's two images from e2e/qauth-commit.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # TEMPORARY: no released image carries the preset loader
      # (qauth-labs/qauth#671) yet, so the server and migration-runner images
      # are built from the qauth commit e2e/qauth-commit names.
      - name: QAuth's server images, from e2e/qauth-commit
        run: bash e2e/qauth-images.sh
      - name: The server image plus the plugin, against a mock identity platform
        run: bash e2e/run.sh
